[www]
user = nginx
group = nginx

listen = 127.0.0.1:9000

pm = dynamic
; Allow short request bursts while keeping the idle pool small.
; Budget memory across all containers before raising this shared default.
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
request_terminate_timeout = 120

chdir = /
